
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Usuários</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card {
            border: 1px solid gray;
            padding: 15px;
            width: 250px;
            cursor: pointer;
        }

        .card.selecionado {
            border: 2px solid blue;
            background-color: lightblue;
        }

        #total {
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Lista de Usuários</h1>

    <div id="cards"></div>

    <p id="total"></p>

    <script src="cardsUsuarios.js"></script>

</body>
</html>
